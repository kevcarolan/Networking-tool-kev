# For developers: create a migration after changing a model, from backend/:
#   alembic revision --autogenerate -m "short description"
# Review the generated file in migrations/versions/ before committing it.
# Installed servers apply migrations by themselves when the app starts
# (app/core/migrate.py); the database is the one NETOPS_DATA_DIR points to.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
