#!/usr/sbin/nft -f
# Host firewall for the NetOps server: deny everything in AND out, except what
# the tools need. Copy to /etc/nftables.conf, edit the "define" lines for your
# network, test with the safe-apply steps in docs/security-hardening.md, then:
#   systemctl enable --now nftables
#
# Outbound filtering matters here: this server holds credentials for every
# network device, so an attacker who gets in must not be able to reach anything else.

# Who may SSH to this server (admin workstations / jump hosts)
define ADMIN_NETS   = { 10.10.10.0/28 }
# Who may open the web GUI
define GUI_NETS     = { 10.10.10.0/24 }
# The wall displays (NOC screens), allowed only the display port (8443). To have no
# display, set it to a single unused address, e.g. { 192.0.2.1 }.
define DISPLAY_NETS = { 10.10.20.0/24 }
# Management addresses of the switches and firewalls
define DEVICE_NETS  = { 10.0.0.0/16 }
# Devices allowed to send syslog to this server (UDP and TCP 514, and TLS on 6514 if it
# is switched on); usually DEVICE_NETS
define SYSLOG_SOURCES = { 10.0.0.0/16 }
# Management addresses of the firewalls upgraded through their API over HTTPS:
# FTD (FDM), FortiGate and PAN-OS (the name is kept for existing installs)
define FDM_HOSTS    = { 10.0.0.250, 10.0.0.251 }
# Central syslog server (optional; see docs/security-hardening.md section 9)
define SYSLOG_HOSTS = { 10.1.1.60 }
# Mail relay for email alerts (optional; Settings > Email alerts)
define SMTP_HOSTS   = { 10.1.1.25 }
# Domain controllers (LDAPS), DNS and NTP servers
define DC_HOSTS     = { 10.1.1.10, 10.1.1.11 }
define DNS_HOSTS    = { 10.1.1.10, 10.1.1.11 }
define NTP_HOSTS    = { 10.1.1.10 }

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iif lo accept
        icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
        tcp dport 22 ip saddr $ADMIN_NETS ct state new limit rate 15/minute accept
        tcp dport { 80, 443 } ip saddr $GUI_NETS accept
        tcp dport 8443 ip saddr $DISPLAY_NETS accept                # wall display (read-only)
        meta l4proto { tcp, udp } th dport 514 ip saddr $SYSLOG_SOURCES accept   # syslog from the devices
        tcp dport 6514 ip saddr $SYSLOG_SOURCES accept               # syslog over TLS (if switched on)
        limit rate 10/minute log prefix "nft-in-drop: " level info
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;
        ct state established,related accept
        oif lo accept
        tcp dport 22 ip daddr $DEVICE_NETS accept                  # SSH to devices (and SCP image copies)
        tcp dport 443 ip daddr $FDM_HOSTS accept                    # management APIs for upgrades: FDM (FTD), FortiGate, PAN-OS
        icmp type echo-request ip daddr $DEVICE_NETS accept         # reachability checks (monitoring ping)
        udp dport 161 ip daddr $DEVICE_NETS accept                  # SNMP polling (monitoring; read-only)
        tcp dport 636 ip daddr $DC_HOSTS accept                     # LDAPS (use 389 if you use StartTLS)
        meta l4proto { tcp, udp } th dport 53 ip daddr $DNS_HOSTS accept
        udp dport 123 ip daddr $NTP_HOSTS accept
        meta l4proto { tcp, udp } th dport 514 ip daddr $SYSLOG_HOSTS accept   # syslog to the central log server
        tcp dport { 25, 465, 587 } ip daddr $SMTP_HOSTS accept      # email alerts to the mail relay
        limit rate 10/minute log prefix "nft-out-drop: " level info
    }
}
