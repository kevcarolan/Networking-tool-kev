# The wall display on its own port. Installed as /etc/nginx/sites-available/netops-display.
# Only the display page and its read-only feed answer here; everything else is 404, and
# the main site (port 443) refuses the display. Open this port in the host firewall only
# for the screens' network (DISPLAY_NETS in /etc/nftables.conf).
# To use another port, change "listen" here and NETOPS_DISPLAY_PORT in netops.env.

server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/netops/tls/netops.crt;
    ssl_certificate_key /etc/netops/tls/netops.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 1k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "";                   # the display never uses a sign-in

    location = / { return 302 /display/; }
    location = /display { return 302 /display/; }
    location ^~ /display/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8710;
    }
    location = /api/display/data {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8710;
    }
    location / { return 404; }
}
