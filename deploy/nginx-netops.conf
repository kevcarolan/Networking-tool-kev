# nginx in front of NetCairn. Installed as /etc/nginx/sites-available/netops.
# Set server_name and put the certificate (issued by your internal CA, including
# any intermediate) and its key in /etc/netops/tls/.

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name netops.corp.local;               # <-- the server's DNS name
    server_tokens off;                           # don't reveal the nginx version

    ssl_certificate     /etc/netops/tls/netops.crt;
    ssl_certificate_key /etc/netops/tls/netops.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:netops:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # replaces, never appends: clients can't spoof it
    proxy_set_header X-Forwarded-Proto https;

    # Firmware image uploads: large, streamed straight through to the app.
    location = /api/firmware/images/upload {
        client_max_body_size 4200m;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://127.0.0.1:8710;
    }

    # Circuit list spreadsheets: the app refuses anything over NETOPS_CIRCUITS_MAX_UPLOAD_MB
    # (25 MB by default); raise both together.
    location = /api/circuits/imports/upload {
        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:8710;
    }

    # Inventory and site imports (the app refuses anything over 10 MB)
    location = /api/inventory/import {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8710;
    }
    location = /api/sites/import {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8710;
    }

    # The wall display has its own port (netops-display); never on this one.
    location ^~ /display/ { return 404; }
    location ^~ /api/display/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8710;
    }
}
