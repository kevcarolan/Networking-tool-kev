<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NetCairn">
  <!-- A cairn (the stones that mark the way on a hill), its top stone lit, with a trail
       linking the stones like a path through a network. -->
