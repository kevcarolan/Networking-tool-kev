    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd76a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffbd3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="11" r="10" fill="url(#glow)"/>
  <rect x="8" y="48" width="48" height="10" rx="5.0" fill="#dfe5f2" transform="rotate(0 32.0 53.0)"/>
  <rect x="14" y="36.5" width="36" height="9.5" rx="4.75" fill="#dfe5f2" transform="rotate(-4 32.0 41.25)"/>
  <rect x="20.5" y="26.5" width="25" height="8.5" rx="4.25" fill="#dfe5f2" transform="rotate(5 33.0 30.75)"/>
  <rect x="24.5" y="18.5" width="16" height="7" rx="3.5" fill="#dfe5f2" transform="rotate(-5 32.5 22.0)"/>
  <ellipse cx="32" cy="11.5" rx="5" ry="3.9" fill="#ffbd3d" stroke="#e39a00" stroke-width="1"/>
  <polyline points="22,53 41,41.2 26,30.8 36,22 32,11.5" fill="none" stroke="#ffbd3d" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="22" cy="53" r="1.8" fill="#ffbd3d"/>
  <circle cx="41" cy="41.2" r="1.8" fill="#ffbd3d"/>
  <circle cx="26" cy="30.8" r="1.8" fill="#ffbd3d"/>
  <circle cx="36" cy="22" r="1.8" fill="#ffbd3d"/>
</svg>
